<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UTV media — каталог кадров</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f8;--card:#fff;--ink:#1a1a1a;--mut:#7a7a7a;--accent:#f15a24;--accent2:#f57c3c;--mark:#ffe0b3}
*{box-sizing:border-box}
body{margin:0;font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15.5px}
header{position:sticky;top:0;z-index:20;background:#fff;color:var(--ink);padding:11px 20px;border-top:3px solid var(--accent);border-bottom:1px solid #ededed;box-shadow:0 1px 8px rgba(0,0,0,.05)}
.hrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{font-size:17px;font-weight:700;white-space:nowrap}
.brand small{display:block;font-size:11px;font-weight:400;opacity:.85}
select,input,button{font-family:inherit;font-size:14px}
#sortSel{padding:7px 10px;border-radius:7px;border:1px solid #e2e2e2;background:#fff;color:var(--ink)}
#expBtn{padding:7px 12px;border-radius:6px;border:none;background:#1a1a1a;color:#fff;font-weight:600;cursor:pointer;white-space:nowrap}
#expBtn:hover{background:#000}
.wm{font-size:21px;font-weight:800;letter-spacing:-.4px;line-height:1}
#brandT{color:var(--accent)}
.wmm{color:var(--ink)}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border-radius:8px;border:1px solid #eceff3;background:#f2f4f6;outline:none;color:var(--ink)}
.search input:focus{background:#fff;border-color:var(--accent)}
.search svg{position:absolute;left:10px;top:9px;width:18px;height:18px;fill:var(--mut)}
.stats{font-size:12px;opacity:.9;white-space:nowrap}
.nav a{color:#cfe0f2;text-decoration:none;font-size:12px;margin-left:8px}
.nav a:hover{color:#fff}
.layout{display:flex;align-items:flex-start;gap:16px;max-width:1500px;margin:0 auto;padding:16px}
aside{position:sticky;top:70px;width:240px;flex:0 0 240px;background:var(--card);border:1px solid #e2e8f0;border-radius:12px;padding:14px;max-height:calc(100vh - 90px);overflow:auto}
aside h3{margin:14px 0 7px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
aside h3:first-child{margin-top:0}
.fg{display:flex;flex-wrap:wrap;gap:6px}
.tog{cursor:pointer;border:1px solid #e2e8f0;background:#fff;border-radius:20px;padding:6px 12px;font-size:13.5px;user-select:none;transition:.12s}
.tog:hover{border-color:var(--accent2)}
.tog .c{color:var(--mut);font-size:11px;margin-left:3px}
.tog.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
.tog.on .c{color:#dbe9f7}
.modeRow{display:flex;gap:6px;align-items:center;margin:6px 0 2px}
.modeRow .lbl{font-size:11px;color:var(--mut)}
.mode{cursor:pointer;border:1px solid #e2e8f0;background:#fff;border-radius:6px;padding:3px 9px;font-size:11.5px}
.mode.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.reset{margin-top:14px;width:100%;padding:9px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;cursor:pointer;color:var(--accent);font-weight:600}
.reset:hover{background:#eef4fb}
main{flex:1;min-width:0}
.count{color:var(--mut);margin:0 2px 12px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.cell{background:var(--card);border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;cursor:default;transition:.12s;border-left:4px solid var(--sc,#ccc)}
.cell:hover{box-shadow:0 4px 14px rgba(0,0,0,.12);transform:translateY(-1px)}
.cell img{width:100%;height:auto;display:block;background:#e9eef3}
.cap{padding:11px 12px}
.capr{display:flex;gap:6px;align-items:center;margin-bottom:5px;flex-wrap:wrap}
.sz{font-weight:700;font-size:15px;color:var(--accent)}
.tm{font-size:13.5px;color:var(--mut)}
.dur{font-size:13.5px;color:var(--mut);margin-left:auto}
.tgs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px}
.chip{font-size:12.5px;padding:2px 9px;border-radius:20px;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 30%,#fff);white-space:nowrap}
.vn{font-size:14px;color:#2a3547;line-height:1.35;word-break:break-word;font-weight:600;margin-bottom:2px}
.activef{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 2px 10px}
.afchip{background:var(--accent);color:#fff;border-radius:16px;padding:4px 10px;font-size:12.5px;cursor:pointer}
.afchip>span{opacity:.85;font-weight:700;margin-left:5px}
.sp{font-size:13.5px;color:#6a3fa0;margin-top:4px;font-weight:600}
#sentinel{height:1px}
.empty{padding:40px;text-align:center;color:var(--mut)}
.ftog{display:none}
/* лайтбокс */
.lb{position:fixed;inset:0;background:rgba(15,22,30,.82);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.lb.on{display:flex}
.lbx{background:#fff;border-radius:14px;max-width:760px;width:100%;max-height:92vh;overflow:auto}
.lbx img{width:100%;border-radius:14px 14px 0 0;display:block}
.lbb{padding:16px 18px}
.lbb h2{margin:0 0 4px;font-size:16px}
.lbb .mt{color:var(--mut);font-size:12.5px;margin-bottom:12px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13px}
.kv div.k{color:var(--mut)}
.lbclose{position:absolute;top:16px;right:20px;font-size:30px;color:#fff;cursor:pointer;line-height:1}
.season-badge{padding:2px 9px;border-radius:6px;font-size:12px;font-weight:600;color:#3a2f10}
@media(max-width:860px){aside{position:static;width:100%;flex-basis:auto;max-height:none}.layout{flex-direction:column;padding:12px}.ftog{display:block;margin:0 0 6px;width:100%;padding:9px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;font-weight:600}aside.collapsed{display:none}}
/* --- калитка доступа и админка --- */
#gate{position:fixed;inset:0;z-index:1000;background:linear-gradient(135deg,#f15a24,#ff8a45);display:flex;align-items:center;justify-content:center;padding:20px}
#gate.hidden{display:none}
.gbox{background:#fff;border-radius:16px;padding:28px 26px;max-width:360px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center}
.gbox h1{margin:0 0 4px;font-size:24px;font-weight:800;color:#f15a24;letter-spacing:-.5px}
.gbox p{margin:0 0 16px;font-size:13px;color:#6b7a8d}
.gbox input{width:100%;padding:11px 12px;border:1px solid #cfd8e3;border-radius:9px;font-size:15px;outline:none;text-align:center}
.gbox input:focus{border-color:#2e75b6}
.gbox button{margin-top:12px;width:100%;padding:11px;border:none;border-radius:9px;background:#f15a24;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.gbox button:hover{background:#d34a16}
.gerr{color:#e53935;font-size:13px;min-height:18px;margin-top:8px}
.gadmin{margin-top:14px;font-size:12px;color:#8aa0b8;cursor:pointer;text-decoration:underline}
#adminBar{display:none;gap:8px;align-items:center;background:#1a1a1a;color:#fff;padding:7px 14px;font-size:13px;flex-wrap:wrap;position:sticky;top:0;z-index:30}
#adminBar.on{display:flex}
#adminBar b{font-weight:800;letter-spacing:.5px;color:#f15a24}
#adminBar button{border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;border-radius:6px;padding:5px 10px;font-size:12.5px;cursor:pointer;font-weight:600}
#adminBar button:hover{background:rgba(255,255,255,.16)}
.editBtn{margin-top:6px;border:1px solid #f15a24;background:#fff;color:#f15a24;border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer;font-weight:600}
.editBtn:hover{background:#f15a24;color:#fff}
#emodal{position:fixed;inset:0;z-index:900;background:rgba(15,22,30,.75);display:none;align-items:center;justify-content:center;padding:16px}
#emodal.on{display:flex}
.ebox{background:#fff;border-radius:14px;max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:20px}
.ebox h2{margin:0 0 14px;font-size:17px}
.efield{margin-bottom:11px}
.efield label{display:block;font-size:12px;color:#6b7a8d;margin-bottom:3px}
.efield input,.efield select{width:100%;padding:8px 9px;border:1px solid #cfd8e3;border-radius:7px;font-size:14px;box-sizing:border-box}
.echips{display:flex;flex-wrap:wrap;gap:6px}
.echip{border:1px solid #cfd8e3;border-radius:16px;padding:5px 10px;font-size:13px;cursor:pointer;user-select:none}
.echip.on{background:#2e75b6;color:#fff;border-color:#2e75b6}
.erow{display:flex;gap:10px}
.erow>div{flex:1}
.ebtns{display:flex;gap:10px;margin-top:16px}
.ebtns button{padding:10px;border-radius:8px;border:none;font-weight:600;cursor:pointer;font-size:14px}
.eSave{background:#1a7f4b;color:#fff;flex:1}
.eDel{background:#e53935;color:#fff}
.eCancel{background:#eef2f6;color:#333;flex:1}

.glogo{font-size:34px;font-weight:800;letter-spacing:-1px;color:#1a1a1a;margin-bottom:2px}
.glogo b{color:#f15a24}
.gtag{margin:0 0 16px;font-size:13px;color:#8a97a5}
.gstats{display:flex;gap:16px;justify-content:center;margin:0 0 18px;font-size:11px;color:#8a97a5;text-transform:uppercase;letter-spacing:.3px}
.gstats b{display:block;font-size:17px;color:#1a1a1a;font-weight:800;letter-spacing:0}
.dsec{margin-bottom:14px}
.dsec h3{margin:0 0 6px;font-size:12px;color:#6b7a8d;text-transform:uppercase;letter-spacing:.4px}
.drow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #f0f0f0}
.dname{flex:1;font-size:14px}
.dcnt{font-size:12px;color:#9aa;min-width:36px;text-align:right}
.dDel{border:none;background:#f7dede;color:#c0392b;border-radius:5px;width:26px;height:26px;cursor:pointer;font-size:13px;line-height:1}
.dDel:hover{background:#e74c3c;color:#fff}
.daddrow{display:flex;gap:6px;margin-top:8px}
.daddrow .dadd{flex:1;padding:7px 9px;border:1px solid #cfd8e3;border-radius:7px;font-size:13px}
.dAddBtn{border:1px solid var(--accent);background:#fff;color:var(--accent);border-radius:7px;padding:0 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.dAddBtn:hover{background:var(--accent);color:#fff}
.facet{border-bottom:1px solid #eef0f2}
.facet:last-of-type{border-bottom:none}
.facet h3{cursor:pointer;display:flex;align-items:center;justify-content:space-between;margin:0;padding:11px 2px}
.facet h3::after{content:"▾";font-size:10px;color:var(--mut);transition:transform .15s}
.facet.collapsed h3::after{transform:rotate(-90deg)}
.facet.collapsed .fbody{display:none}
.fbody{padding-bottom:10px}
</style>
</head>
<body>
<div id="gate"><div class="gbox">
  <div class="glogo"><b>UTV</b> media</div>
  <p class="gtag">Enter password</p>
  <input id="gpass" type="password" placeholder="Password" autocomplete="off">
  <div class="gerr" id="gerr"></div>
  <button id="gbtn">Sign in</button>
</div></div>
<div id="adminBar">
  <b>РЕЖИМ АДМИНА</b>
  <button id="abAdd">+ Добавить кадр</button>
  <button id="abDict">Справочники</button>
  <button id="abAcct">Аккаунты</button>
  <button id="abExit">Выйти</button>
</div>
<div id="emodal"><div class="ebox" id="ebox"></div></div>

<header>
  <div class="hrow">
    <div class="brand"><span class="wm"><span id="brandT">UTV</span> <span class="wmm">media</span></span><small id="subTitle"></small></div>
    <div class="search">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      <input id="q" type="search" placeholder="Поиск планов: ролик, объект, вид…" autocomplete="off">
    </div>
    <select id="sortSel" title="Сортировка">
      <option value="id" id="oId">По порядку</option>
      <option value="durd" id="oDurd">Дольше сначала</option>
      <option value="dura" id="oDura">Короче сначала</option>
      <option value="size" id="oSize">По крупности</option>
      <option value="video" id="oVideo">По ролику</option>
    </select>
    <button id="expBtn" title="Выгрузить кадры текущей выборки в Excel (без фото)">⬇ Excel</button>
    <div class="stats" id="stats"></div>
  </div>
</header>
<div class="layout">
  <button class="ftog" id="ftog">Фильтры ▾</button>
  <aside id="filters">
    <div class="facet collapsed"><h3 id="hCountry">Страна</h3><div class="fbody"><div class="fg" id="fCountry"></div></div></div>
    <div class="facet collapsed"><h3 id="hRegion">Регион</h3><div class="fbody"><div class="fg" id="fRegion"></div></div></div>
    <div class="facet collapsed"><h3 id="hSeason">Сезон</h3><div class="fbody"><div class="fg" id="fSeason"></div></div></div>
    <div class="facet collapsed"><h3 id="hFrame">Что в кадре</h3><div class="fbody"><div class="modeRow"><span class="lbl" id="hMode">режим:</span><span class="mode on" data-mode="and" id="mAnd">И (все)</span><span class="mode" data-mode="or" id="mOr">ИЛИ (любое)</span></div><div class="fg" id="fCats"></div></div></div>
    <div class="facet collapsed"><h3 id="hSize">Крупность плана</h3><div class="fbody"><div class="fg" id="fSizes"></div></div></div>
    <button class="reset" id="reset">Сбросить фильтры</button>
  </aside>
  <main>
    <div class="activef" id="activeF"></div>
    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
    <div id="sentinel"></div>
  </main>
</div>
<script src="manifest_shots.js"></script>
<script>
const CATS=[["коптер","Коптер"],["горы","Горы"],["река","Реки"],["озеро","Озёра"],["лес","Лес"],
 ["море","Море/океан"],["водопад","Водопады"],["закат","Закаты/рассветы"],["пустыня","Пустыня"],
 ["подвода","Подводная"],["цветы","Цветы"],["животные","Животные"],["птицы","Птицы"]];
const CATDISP={};CATS.forEach(([k,l])=>CATDISP[k]=l);
const CATCOLOR={"коптер":"#00897b","горы":"#8d6e63","река":"#1e88e5","озеро":"#0277bd","лес":"#43a047","море":"#006064","водопад":"#00acc1","закат":"#fb8c00","пустыня":"#b8860b","подвода":"#3949ab","цветы":"#e91e63","животные":"#8e24aa","птицы":"#5e35b1"};
const SIZE_ORDER=["Дальний","Общий","Средний","Крупный","Деталь"];
const SIZE_RANK={"Дальний":0,"Общий":1,"Средний":2,"Крупный":3,"Деталь":4};
const SIZE_COLOR={"Дальний":"#90a4ae","Общий":"#42a5f5","Средний":"#66bb6a","Крупный":"#ffa726","Деталь":"#ef5350"};
const SEASONS=["Зима","Весна","Лето","Осень"];
const SEASON_COLOR={"Зима":"#dbeeff","Весна":"#dcf5dc","Лето":"#fff3c4","Осень":"#ffe0c2"};
let CAT=null,PLANS=[],filtered=[],shown=0;const PAGE=250;
const L18={
 ru:{brand:"UTV media",all:"все регионы",ph:"Поиск планов: ролик, объект, вид…",
  srt:{oId:"По порядку",oDurd:"Дольше сначала",oDura:"Короче сначала",oSize:"По крупности",oVideo:"По ролику"},
  exp:"⬇ Excel",expT:"Выгрузить кадры текущей выборки в Excel (без фото)",lang:"EN",langT:"Switch interface to English",
  ftog:"Фильтры ▾",hRegion:"Регион",hCountry:"Страна",hSeason:"Сезон",hFrame:"Что в кадре",hMode:"режим:",
  and:"И (все)",or:"ИЛИ (любое)",hSize:"Крупность плана",reset:"Сбросить фильтры",
  found:"Найдено кадров",total:"суммарно",statP:"кадров",statV:"роликов",statH:"ч",h:"ч",m:"мин",s:"с",
  empty:"В выборке нет кадров.",fname:"кадры_выборка",
  hdr:["№","Ролик","№ видео","Регион","Страна","Сезон","План №","Длительность, с","Тайм-код","Крупность","Теги","Животные/птицы"],
  cats:null,sizes:null,seasons:null},
 en:{brand:"UTV media",all:"all regions",ph:"Search shots: clip, subject, species…",
  srt:{oId:"Default order",oDurd:"Longest first",oDura:"Shortest first",oSize:"By shot size",oVideo:"By clip"},
  exp:"⬇ Excel",expT:"Export current selection to Excel (no photos)",lang:"RU",langT:"Вернуть русский интерфейс",
  ftog:"Filters ▾",hRegion:"Region",hCountry:"Country",hSeason:"Season",hFrame:"What is in frame",hMode:"mode:",
  and:"AND (all)",or:"OR (any)",hSize:"Shot size",reset:"Reset filters",
  found:"Shots found",total:"total",statP:"shots",statV:"clips",statH:"h",h:"h",m:"min",s:"s",
  empty:"No shots in the selection.",fname:"shots_selection",
  hdr:["#","Clip","Clip #","Region","Country","Season","Shot #","Duration, s","Timecode","Shot size","Tags","Animals/birds"],
  cats:{"коптер":"Aerial (drone)","горы":"Mountains","река":"Rivers","озеро":"Lakes","лес":"Forest","море":"Sea / ocean","водопад":"Waterfalls","закат":"Sunsets / sunrises","пустыня":"Desert","подвода":"Underwater","цветы":"Flowers","животные":"Animals","птицы":"Birds"},
  sizes:{"Дальний":"Extreme long","Общий":"Long","Средний":"Medium","Крупный":"Close-up","Деталь":"Extreme close-up"},
  seasons:{"Зима":"Winter","Весна":"Spring","Лето":"Summer","Осень":"Autumn"}}
};
let TOTV=0,TOTD=0;
function LG(){return L18[state.lang]||L18.ru;}
function dCat(k){const d=LG().cats;return (d&&d[k])||CATDISP[k]||k;}
function dSize(x){const d=LG().sizes;return (d&&d[x])||x;}
function dSeason(x){const d=LG().seasons;return (d&&d[x])||x;}
var REG_EN={"Алтай":"Altai","Байкал":"Baikal","Башкортостан":"Bashkortostan","Кавказ":"Caucasus","Камчатка":"Kamchatka","Карелия":"Karelia","Кольский":"Kola Peninsula","Крым":"Crimea","Поволжье":"Volga region","Русский Север":"Russian North","Северо-Запад":"Northwest","Сибирь":"Siberia","Средняя полоса":"Central Russia","Урал":"Ural"};
var CO_EN={"Абхазия":"Abkhazia","Австрия":"Austria","Албания":"Albania","Армения":"Armenia","Беларусь":"Belarus","Болгария":"Bulgaria","Босния и Герцеговина":"Bosnia and Herzegovina","Венгрия":"Hungary","Германия":"Germany","Греция":"Greece","Грузия":"Georgia","Египет":"Egypt","Исландия":"Iceland","Испания":"Spain","Италия":"Italy","Казахстан":"Kazakhstan","Киргизия":"Kyrgyzstan","Марокко":"Morocco","Монголия":"Mongolia","Норвегия":"Norway","Португалия":"Portugal","Россия":"Russia","Румыния":"Romania","Северная Македония":"North Macedonia","Сербия":"Serbia","Словакия":"Slovakia","Словения":"Slovenia","Таджикистан":"Tajikistan","Таиланд":"Thailand","Турция":"Turkey","Филиппины":"Philippines","Франция":"France","Хорватия":"Croatia","Черногория":"Montenegro","Чехия":"Czechia","Швейцария":"Switzerland","Шри-Ланка":"Sri Lanka"};
function dRegion(x){return state.lang==="en"?(REG_EN[x]||x):x;}
function dCountry(x){return state.lang==="en"?(CO_EN[x]||x):x;}
var TR={"а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ё":"e","ж":"zh","з":"z","и":"i","й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u","ф":"f","х":"kh","ц":"ts","ч":"ch","ш":"sh","щ":"shch","ъ":"","ы":"y","ь":"","э":"e","ю":"yu","я":"ya"};
function translit(str){return String(str).replace(/[а-яё]/gi,function(ch){var low=ch.toLowerCase();var t=TR[low];if(t===undefined)return ch;return ch===low?t:(t.charAt(0).toUpperCase()+t.slice(1));});}

  const fCo=document.getElementById("fCountry");fCo.innerHTML="";
  const cos=[...new Set(PLANS.map(p=>p.country))].sort((a,b)=>a.localeCompare(b,"ru"));
  cos.forEach(co=>{const n=cntP(p=>p.country===co);if(n)fCo.appendChild(mkTog(dCountry(co),n,state.countries,co));});
  const fS=document.getElementById("fSeason");fS.innerHTML="";
  SEASONS.forEach(s=>{const n=cntP(p=>p.season===s);if(n)fS.appendChild(mkTog(dSeason(s),n,state.seasons,s));});

function mkTog(label,n,set,key){const b=document.createElement("span");b.className="tog"+(set.has(key)?" on":"");b.innerHTML=esc(label)+'<span class="c">'+n+'</span>';b.addEventListener("click",()=>{set.has(key)?set.delete(key):set.add(key);b.classList.toggle("on");render();});return b;}
function match(p){
  if(state.regions.size&&!state.regions.has(p.region))return false;
  if(state.countries.size&&!state.countries.has(p.country))return false;
  if(state.seasons.size&&!state.seasons.has(p.season))return false;
  if(state.sizes.size&&!state.sizes.has(p.size))return false;
  if(state.cats.size){
    if(state.mode==="and"){for(const c of state.cats)if(p.tags.indexOf(c)<0)return false;}
    else{let ok=false;for(const c of state.cats)if(p.tags.indexOf(c)>=0){ok=true;break;}if(!ok)return false;}
  }
  const q=state.q.trim().toLowerCase();if(q&&p._s.indexOf(q)<0)return false;
  return true;
}
function sortP(a){const s=state.sort,arr=a.slice();
  if(s==="durd")arr.sort((x,y)=>y.dur-x.dur);
  else if(s==="dura")arr.sort((x,y)=>x.dur-y.dur);
  else if(s==="size")arr.sort((x,y)=>SIZE_RANK[y.size]-SIZE_RANK[x.size]||x.gid-y.gid);
  else if(s==="video")arr.sort((x,y)=>x.vname.localeCompare(y.vname,"ru")||x.gid-y.gid);
  else arr.sort((x,y)=>x.gid-y.gid);
  return arr;}

function exportXls(){

    const tags=p.tags.map(k=>dCat(k)).join(", ");

    const cells=[i+1,p.vname,p.vid,dRegion(p.region),dCountry(p.country),dSeason(p.season),p.sn,
                 Math.round(p.dur),tc(p.t0)+"-"+tc(p.t1),dSize(p.size),tags,sp];

  });

function cyrb53(str,seed){seed=seed||0;var h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(var i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0);}
function weekId(d){d=d||new Date();var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var day=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-day+3);var f=new Date(Date.UTC(t.getUTCFullYear(),0,4));var w=1+Math.round(((t-f)/864e5-3+((f.getUTCDay()+6)%7))/7);return t.getUTCFullYear()+"-W"+String(w).padStart(2,"0");}

function applyCustomTags(){loadCustomTags().forEach(function(t){if(!CATDISP[t.key]){CATS.push([t.key,t.label]);CATDISP[t.key]=t.label;CATCOLOR[t.key]=t.color||"#f15a24";}});}
function loadCustomRegions(){try{return JSON.parse(lsGet("bis_regions")||"[]");}catch(e){return [];}}
function loadCustomCountries(){try{return JSON.parse(lsGet("bis_countries")||"[]");}catch(e){return [];}}
function uniq(a){return a.filter(function(v,i){return v&&a.indexOf(v)===i;});}
function addCustomTag(v){var key=v.toLowerCase();if(!CATDISP[key]){var col=TAG_PAL[CATS.length%TAG_PAL.length];CATS.push([key,v]);CATDISP[key]=v;CATCOLOR[key]=col;var ct=loadCustomTags();ct.push({key:key,label:v,color:col});lsSet("bis_tags",JSON.stringify(ct));}return key;}
function saveOv(){try{localStorage.setItem("bis_ov",JSON.stringify(OV));}catch(e){alert("Не удалось сохранить правки: хранилище браузера переполнено.");}}
function applyAdminOverrides(){
  var del={};(OV.del||[]).forEach(function(g){del[g]=1;});
  PLANS=PLANS.filter(function(p){return !del[p.gid];});
  var ed=OV.edits||{};
  PLANS.forEach(function(p){var e=ed[p.gid];if(e)for(var k in e)p[k]=e[k];});
  (OV.add||[]).forEach(function(p){PLANS.push(p);});
  var dT=OV.delTags||[],dR=OV.delRegions||[],dC=OV.delCountries||[];
  if(dT.length||dR.length||dC.length){PLANS.forEach(function(p){
    if(dT.length)p.tags=(p.tags||[]).filter(function(t){return dT.indexOf(t)<0;});
    if(dR.indexOf(p.region)>=0)p.region="—";
    if(dC.indexOf(p.country)>=0)p.country="—";
  });}
}

function rebuildPlans(){

  var plans=[],videos=0,dur=0;
  ids.forEach(function(id){var c=cats[id];(c.plans||[]).forEach(function(p){plans.push(p);});videos+=c.videos||0;dur+=c.dur||0;});
  CAT={title:"UTV media",plans:plans,videos:videos,dur:dur};PLANS=plans;
  applyAdminOverrides();
  PLANS.forEach(function(p){var parts=[p.vname,p.season,p.region,p.country,p.animal||"",p.bird||"",p.size];p.tags.forEach(function(k){parts.push(CATDISP[k]||k);});parts.push(REG_EN[p.region]||"",CO_EN[p.country]||"",(L18.en.seasons&&L18.en.seasons[p.season])||"",(L18.en.sizes&&L18.en.sizes[p.size])||"",translit(p.vname),(SP_EN[(p.animal||"").toLowerCase()]||""),(SP_EN[(p.bird||"").toLowerCase()]||""));p.tags.forEach(function(k){parts.push((L18.en.cats&&L18.en.cats[k])||"");});p._s=parts.join(" ").toLowerCase();});

/* --- аккаунты вместо недельного пароля --- */
var ACCT_SECRET="utv-acct-2026-7k";
function dayNum(){return Math.floor(Date.now()/86400000);}
function acctSig(eb,nonce){return cyrb53(eb+"|"+nonce+"|"+ACCT_SECRET).toString(36).slice(0,6);}
function makeAccount(days){var exp=dayNum()+(days||7);var eb=exp.toString(36);var nonce=(Math.random().toString(36)+"0000").slice(2,6);return {pw:"utv-"+eb+"-"+nonce+acctSig(eb,nonce),exp:exp};}
function checkAccount(pw){pw=(pw||"").trim().toLowerCase();if(pw.indexOf("utv-")!==0)return false;var rest=pw.slice(4);var i=rest.indexOf("-");if(i<1)return false;var eb=rest.slice(0,i),body=rest.slice(i+1);if(body.length!==10)return false;var nonce=body.slice(0,4),sig=body.slice(4);if(acctSig(eb,nonce)!==sig)return false;var exp=parseInt(eb,36);if(isNaN(exp))return false;return dayNum()<=exp;}
function unlocked(){var a=lsGet("bis_acct");if(a&&checkAccount(a))return true;return lsGet("bis_admin")==="1";}
function tryPass(){
  var v=(document.getElementById("gpass").value||"").trim();
  var adm=document.getElementById("gpass").dataset.admin==="1";
  if(adm){if(v===ADMIN_PASS){ADMIN=true;lsSet("bis_admin","1");enter();return;}document.getElementById("gerr").textContent="Wrong administrator password";return;}
  if(v===ADMIN_PASS){ADMIN=true;lsSet("bis_admin","1");enter();return;}
  if(checkAccount(v)){lsSet("bis_acct",v);enter();return;}
  document.getElementById("gerr").textContent="Wrong or expired password";
}
function initGate(){
  if(location.hash==="#logout"){lsDel("bis_acct");lsDel("bis_admin");location.replace(location.href.split("#")[0]);return;}
  var wantAdmin=(location.hash==="#admin");
  if(unlocked()&&!wantAdmin){if(lsGet("bis_admin")==="1")ADMIN=true;enter();return;}
  document.getElementById("gbtn").addEventListener("click",tryPass);
  document.getElementById("gpass").addEventListener("keydown",function(e){if(e.key==="Enter")tryPass();});
  document.getElementById("gadmin").addEventListener("click",function(){document.getElementById("gpass").dataset.admin="1";document.getElementById("gerr").textContent="Administrator password";document.getElementById("gpass").focus();});
  if(wantAdmin){document.getElementById("gpass").dataset.admin="1";document.getElementById("gerr").textContent="Administrator password";}
  document.getElementById("gpass").focus();
}
function enter(){
  document.getElementById("gate").classList.add("hidden");
  if(ADMIN){
    document.getElementById("adminBar").classList.add("on");
    document.getElementById("abAdd").onclick=openAdd;
    document.getElementById("abDict").onclick=openDict;
    var ab=document.getElementById("abAcct");if(ab)ab.onclick=openAccounts;
    document.getElementById("abExit").onclick=function(){lsDel("bis_admin");location.reload();};
  }
  loadCatalogs();
}
function loadAccts(){try{var a=JSON.parse(lsGet("bis_accounts")||"[]");var t=dayNum();return a.filter(function(x){return x.exp>=t;});}catch(e){return [];}}
function saveAccts(a){lsSet("bis_accounts",JSON.stringify(a));}
function openAccounts(){
  var box=document.getElementById("ebox");box.onclick=null;

function filterExcept(except){
  return PLANS.filter(function(p){
    if(except!=="reg"&&state.regions.size&&!state.regions.has(p.region))return false;
    if(except!=="cou"&&state.countries.size&&!state.countries.has(p.country))return false;
    if(except!=="sea"&&state.seasons.size&&!state.seasons.has(p.season))return false;
    if(except!=="siz"&&state.sizes.size&&!state.sizes.has(p.size))return false;
    if(except!=="cat"&&state.cats.size){
      if(state.mode==="and"){var ok=true;state.cats.forEach(function(c){if(p.tags.indexOf(c)<0)ok=false;});if(!ok)return false;}
      else{var any=false;state.cats.forEach(function(c){if(p.tags.indexOf(c)>=0)any=true;});if(!any)return false;}
    }
    var q=state.q.trim().toLowerCase();if(q&&p._s.indexOf(q)<0)return false;
    return true;
  });
}

/* ==== ЯЗЫК АККАУНТА: язык зашит в пароль, выбирается админом при выдаче ==== */
/* Формат пароля:
   старый  utv-<exp36>-<nonce4><sig6>          (тело 10) — считается русским
   новый   utv-<exp36>-<lang1><nonce4><sig6>   (тело 11) — lang: r=ru, e=en
   Язык входит в подпись, поэтому подменить его в пароле вручную нельзя. */
function acctSig2(eb,lc,nonce){return cyrb53(eb+"|"+lc+"|"+nonce+"|"+ACCT_SECRET).toString(36).slice(0,6);}
function makeAccount(days,lang){
  lang=(lang==="en")?"en":"ru";
  var lc=(lang==="en")?"e":"r";
  var exp=dayNum()+(days||7);
  var eb=exp.toString(36);
  var nonce=(Math.random().toString(36)+"0000").slice(2,6);
  return {pw:"utv-"+eb+"-"+lc+nonce+acctSig2(eb,lc,nonce),exp:exp,lang:lang};
}
/* возвращает false либо {exp,lang} — объект истинный, поэтому старые if(checkAccount(..)) работают */
function checkAccount(pw){
  pw=(pw||"").trim().toLowerCase();
  if(pw.indexOf("utv-")!==0)return false;
  var rest=pw.slice(4),i=rest.indexOf("-");
  if(i<1)return false;
  var eb=rest.slice(0,i),body=rest.slice(i+1),lang="ru",nonce,sig;
  if(body.length===10){
    nonce=body.slice(0,4);sig=body.slice(4);
    if(acctSig(eb,nonce)!==sig)return false;
  }else if(body.length===11){
    var lc=body.charAt(0);
    if(lc!=="r"&&lc!=="e")return false;
    nonce=body.slice(1,5);sig=body.slice(5);
    if(acctSig2(eb,lc,nonce)!==sig)return false;
    lang=(lc==="e")?"en":"ru";
  }else return false;
  var exp=parseInt(eb,36);
  if(isNaN(exp))return false;
  if(dayNum()>exp)return false;
  return {exp:exp,lang:lang};
}
